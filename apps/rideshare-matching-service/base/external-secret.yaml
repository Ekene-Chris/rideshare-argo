apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rideshare-matching-service-secrets
  labels:
    app: rideshare-matching-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: rideshare-matching-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: PLACEHOLDER_AWS_SECRET_NAME
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: PLACEHOLDER_AWS_SECRET_NAME
        property: JWT_SECRET
    - secretKey: REDIS_URL
      remoteRef:
        key: PLACEHOLDER_AWS_SECRET_NAME
        property: REDIS_URL
