apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideshare-matching-service
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: rideshare-matching-service
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
